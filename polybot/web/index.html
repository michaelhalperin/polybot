<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Polybot Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c232d; --border:#2d3640;
    --text:#e6edf3; --muted:#8b949e; --green:#3fb950; --red:#f85149;
    --blue:#58a6ff; --yellow:#d29922; --accent:#7c5cff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;}
  header{display:flex;align-items:center;gap:16px;padding:14px 22px;
    background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
  header h1{font-size:18px;margin:0;letter-spacing:.5px}
  header h1 .dot{color:var(--accent)}
  .badge{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);
    text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .status{display:flex;align-items:center;gap:7px;font-size:13px}
  .led{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .led.on{background:var(--green);box-shadow:0 0 8px var(--green)}
  .led.off{background:var(--red)}
  .spacer{flex:1}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--border);
    padding:7px 13px;border-radius:7px;cursor:pointer;font-size:13px;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--green);border-color:var(--green);color:#08130a;font-weight:600}
  button.danger{background:transparent;border-color:var(--red);color:var(--red)}
  button:disabled{opacity:.4;cursor:not-allowed}
  main{padding:20px;max-width:1400px;margin:0 auto;overflow-x:hidden}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .card .value-wrap{overflow:hidden;height:30px;margin-top:6px}
  .card .value{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:30px}
  .card .value.tick-up{animation:cardTickUp .5s cubic-bezier(.22,1,.36,1)}
  .card .value.tick-down{animation:cardTickDown .5s cubic-bezier(.22,1,.36,1)}
  @keyframes cardTickUp{
    0%{transform:translateY(10px);opacity:.35}
    100%{transform:translateY(0);opacity:1}
  }
  @keyframes cardTickDown{
    0%{transform:translateY(-10px);opacity:.35}
    100%{transform:translateY(0);opacity:1}
  }
  .card .sub{font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
  @media(max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:20px;min-width:0}
  .panel h2{font-size:14px;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;
    display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .table-wrap{overflow:auto;max-height:380px;max-width:100%;-webkit-overflow-scrolling:touch}
  .table-wrap.tall{max-height:300px}
  table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
  table.pos-table{min-width:640px;table-layout:auto}
  th{text-align:left;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;white-space:nowrap}
  td{padding:7px 8px;border-bottom:1px solid #1f262e;vertical-align:top}
  tr:last-child td{border-bottom:none}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .pill{font-size:10px;padding:2px 7px;border-radius:12px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  .pill.arbitrage{background:rgba(63,185,80,.15);color:var(--green)}
  .pill.value{background:rgba(88,166,255,.15);color:var(--blue)}
  .pill.buy{background:rgba(63,185,80,.15);color:var(--green)}
  .pill.sell{background:rgba(248,81,73,.15);color:var(--red)}
  .q{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .num{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
  #logs{background:#0a0e13;border:1px solid var(--border);border-radius:8px;padding:12px;
    height:220px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.55;color:#b9c2cc}
  #logs .l-INFO{color:#b9c2cc} #logs .l-WARNING{color:var(--yellow)} #logs .l-ERROR{color:var(--red)}
  .muted{color:var(--muted)} .empty{color:var(--muted);padding:14px;text-align:center}
  .settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .settings label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
  .settings input{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:6px;font-size:13px}
  details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-bottom:10px}
  .equity-hover-info{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:12px;min-height:34px;
    margin-bottom:10px;padding:8px 12px;border-radius:7px;background:var(--panel2);
    border:1px solid var(--border);align-items:center}
  .equity-hover-info .hint{color:var(--muted);font-size:12px}
  .equity-hover-info .stat{display:flex;gap:6px;align-items:baseline;white-space:nowrap}
  .equity-hover-info .stat .k{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
  .equity-hover-info .stat .v{font-variant-numeric:tabular-nums;font-weight:600}
  .equity-chart-wrap{position:relative}
  #aiBadge{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);
    letter-spacing:.5px;text-transform:uppercase}
  #aiBadge.on{color:var(--accent);border-color:var(--accent)}
  #aiBadge.off{color:var(--muted)}
  .ai-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:12px}
  .ai-cards .card{padding:10px 12px}
  .ai-cards .value{font-size:22px;font-weight:600}
  .ai-cards .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .verdict{font-size:10px;padding:2px 7px;border-radius:12px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  .verdict.trade{background:rgba(63,185,80,.15);color:var(--green)}
  .verdict.skip{background:rgba(248,81,73,.15);color:var(--red)}
  .risk-low{color:var(--green)} .risk-medium{color:var(--yellow)} .risk-high{color:var(--red)}
  .ai-note{color:var(--muted);font-size:12px;margin:2px 0 14px;line-height:1.55}
  .ai-off{color:var(--muted);padding:18px;text-align:center;line-height:1.7}
  .ai-off code{background:var(--panel2);padding:1px 6px;border-radius:4px;color:var(--text)}
  .report-banner{padding:11px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;border:1px solid var(--border);line-height:1.5}
  .report-banner.too_early{background:rgba(139,148,158,.12);color:var(--muted)}
  .report-banner.early{background:rgba(210,153,34,.12);color:var(--yellow)}
  .report-banner.meaningful{background:rgba(88,166,255,.12);color:var(--blue)}
  .report-banner.solid{background:rgba(63,185,80,.12);color:var(--green)}
  .report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
  .report-grid .card{padding:10px 12px}
  .report-grid .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .report-grid .value{font-size:20px;font-weight:600;margin-top:4px}
  .report-grid .sub{color:var(--muted);font-size:11px;margin-top:2px}
</style>
</head>
<body>
<header>
  <h1>JAKE</h1>
  <span class="badge" id="mode">paper</span>
  <span id="aiBadge" class="off" title="AI market-understanding layer">AI off</span>
  <div class="status"><span class="led" id="led"></span><span id="statusText">—</span></div>
  <div class="spacer"></div>
  <button class="primary" id="btnStart" onclick="control('start')">▶ Start</button>
  <button class="danger" id="btnStop" onclick="control('stop')">■ Stop</button>
  <button id="btnOnce" onclick="control('run_once')">↻ Run one cycle</button>
  <button id="btnScan" onclick="scan()">🔍 Scan now</button>
</header>

<main>
  <div class="cards" id="cards"></div>

  <div class="panel">
    <h2>Equity curve <span class="muted" id="cycleInfo"></span></h2>
    <div class="equity-chart-wrap">
      <canvas id="equityChart" height="90"></canvas>
    </div>
  </div>

  <div class="panel">
    <h2>Performance report <span class="muted" id="reportSub"></span></h2>
    <div id="reportBody"></div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>Opportunities <span class="muted" id="oppCount"></span></h2>
      <div class="table-wrap"><table id="oppTable"></table></div>
    </div>
    <div class="panel">
      <h2>Open positions <span class="muted" id="posCount"></span></h2>
      <div class="table-wrap"><table id="posTable" class="pos-table"></table></div>
    </div>
  </div>

  <div class="panel">
    <h2>AI market understanding <span class="muted" id="aiModel"></span></h2>
    <div id="aiBody"></div>
  </div>

  <div class="panel">
    <h2>Recent trades</h2>
    <div class="table-wrap tall"><table id="tradeTable"></table></div>
  </div>

  <div class="panel">
    <h2>Live log</h2>
    <div id="logs"></div>
  </div>

  <div class="panel">
    <details>
      <summary>⚙ Strategy &amp; risk settings (applied live)</summary>
      <div class="settings" id="settings"></div>
      <div style="margin-top:14px"><button class="primary" onclick="saveSettings()">Save settings</button>
        <span class="muted" id="saveMsg" style="margin-left:10px"></span></div>
    </details>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const money = n => (n<0?"-$":"$") + Math.abs(n).toFixed(2);
const pct = n => (n>=0?"+":"") + n.toFixed(2) + "%";
const cls = n => n>0?"pos":(n<0?"neg":"");
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const fmtCard = (n, fmt) => fmt === "money" ? money(n) : fmt === "pct" ? pct(n) : n.toFixed(0) + "%";
const animFrames = new WeakMap();

function animateValue(el, from, to, fmt, duration=600){
  if(animFrames.has(el)) cancelAnimationFrame(animFrames.get(el));
  if(Math.abs(to - from) < 0.005){ el.textContent = fmtCard(to, fmt); return; }
  const start = performance.now();
  const tick = dir => {
    el.classList.remove("tick-up", "tick-down");
    void el.offsetWidth;
    el.classList.add(dir > 0 ? "tick-up" : "tick-down");
  };
  tick(to - from);
  const frame = now => {
    const t = Math.min(1, (now - start) / duration);
    el.textContent = fmtCard(from + (to - from) * easeOutCubic(t), fmt);
    if(t < 1) animFrames.set(el, requestAnimationFrame(frame));
    else{ animFrames.delete(el); el.textContent = fmtCard(to, fmt); }
  };
  animFrames.set(el, requestAnimationFrame(frame));
}

const cardPrev = {};

async function api(path, opts){ const r = await fetch(path, opts); return r.json(); }

async function refresh(){
  try{
    const s = await api("/api/status");
    $("mode").textContent = s.mode;
    $("led").className = "led " + (s.running ? "on":"off");
    $("statusText").textContent = s.running
      ? (s.external ? "running · terminal" : "running")
      : "stopped";
    $("btnStart").disabled = s.running;
    $("btnStop").disabled = !s.running || s.external;
    $("btnOnce").disabled = s.running;
    $("cycleInfo").textContent = s.cycle_count ?
       `· cycle ${s.cycle_count} · ${s.open_count} open` : "";
    const aib = $("aiBadge");
    aib.className = s.ai_active ? "on" : "off";
    aib.textContent = s.ai_active ? "AI on" : "AI off";
    renderCards(s);
    renderEquity(await api("/api/equity"));
    renderReport(await api("/api/report"));
    renderOpps(await api("/api/opportunities"));
    renderPositions(await api("/api/positions"));
    renderTrades(await api("/api/trades?limit=40"));
    renderAI(await api("/api/ai"));
    renderLogs(await api("/api/logs"));
  }catch(e){ console.error(e); }
}

function renderCards(s){
  const defs = [
    {key:"total", label:"Total equity", num:s.total, fmt:"money", cls:cls(s.pct),
      sub:{num:s.pct, fmt:"pct", cls:cls(s.pct)}},
    {key:"cash", label:"Cash", num:s.cash, fmt:"money"},
    {key:"exposure", label:"Open exposure", num:s.positions_val, fmt:"money",
      sub:{text:s.open_count + " positions"}},
    {key:"realized", label:"Realized P&L", num:s.realized_pnl, fmt:"money", cls:cls(s.realized_pnl)},
    {key:"winrate", label:"Win rate", num:s.win_rate, fmt:"pct0", sub:{text:s.closed + " closed"}},
    {key:"bankroll", label:"Start bankroll", num:s.start_bankroll, fmt:"money"},
  ];
  const root = $("cards");
  if(!root.dataset.ready){
    root.dataset.ready = "1";
    root.innerHTML = defs.map(d=>`<div class="card" data-key="${d.key}">
      <div class="label">${d.label}</div>
      <div class="value-wrap"><div class="value" data-field="value"></div></div>
      <div class="sub" data-field="sub" hidden></div></div>`).join("");
  }
  defs.forEach(d=>{
    const card = root.querySelector(`[data-key="${d.key}"]`);
    const valEl = card.querySelector('[data-field="value"]');
    const subEl = card.querySelector('[data-field="sub"]');
    const prev = cardPrev[d.key];
    valEl.className = "value " + (d.cls || "");
    if(prev == null) valEl.textContent = fmtCard(d.num, d.fmt);
    else if(prev.num !== d.num) animateValue(valEl, prev.num, d.num, d.fmt);
    else valEl.textContent = fmtCard(d.num, d.fmt);
    if(d.sub){
      subEl.hidden = false;
      if(d.sub.text){
        subEl.className = "sub";
        subEl.textContent = d.sub.text;
      } else {
        subEl.className = "sub " + (d.sub.cls || "");
        if(prev == null || prev.subNum == null) subEl.textContent = fmtCard(d.sub.num, d.sub.fmt);
        else if(prev.subNum !== d.sub.num) animateValue(subEl, prev.subNum, d.sub.num, d.sub.fmt, 500);
        else subEl.textContent = fmtCard(d.sub.num, d.sub.fmt);
        cardPrev[d.key] = {num:d.num, subNum:d.sub.num};
        return;
      }
    } else subEl.hidden = true;
    cardPrev[d.key] = {num:d.num};
  });
}

let chart, equityRows = [];
const equityChartOptions = {
  plugins:{
    legend:{display:false},
    tooltip:{
      enabled:true, backgroundColor:"#1c232d", borderColor:"#2d3640", borderWidth:1,
      titleColor:"#8b949e", bodyColor:"#e6edf3", footerColor:"#8b949e",
      padding:10, displayColors:false, caretPadding:8,
      callbacks:{
        title:items=>{
          const r = equityRows[items[0].dataIndex];
          return r ? new Date(r.ts*1000).toLocaleString() : "";
        },
        label:ctx=>`Total equity: ${money(ctx.parsed.y)}`,
        afterBody:items=>{
          const r = equityRows[items[0].dataIndex];
          if(!r) return [];
          const base = equityRows[0]?.total ?? r.total;
          const chg = r.total - base;
          const chgPct = base ? (chg / base * 100) : 0;
          return [
            `Cash: ${money(r.cash)}`,
            `Positions: ${money(r.positions_val)}`,
            `Realized P&L: ${money(r.realized_pnl)}`,
            `Change: ${money(chg)} (${pct(chgPct)})`,
          ];
        },
      },
    },
  },
  interaction:{mode:"index", intersect:false},
  onHover:(e,els)=>{ e.native.target.style.cursor = els.length ? "crosshair" : "default"; },
  responsive:true,
  scales:{x:{ticks:{color:"#8b949e",maxTicksLimit:8},grid:{color:"#1f262e"}},
          y:{ticks:{color:"#8b949e",callback:v=>money(v)},grid:{color:"#1f262e"}}},
};

function setEquityHover(idx){
  const el = $("equityHover");
  if(idx == null || !equityRows[idx]){
    el.innerHTML = '<span class="hint">Hover chart to see snapshot details</span>';
    return;
  }
  const r = equityRows[idx];
  const base = equityRows[0]?.total ?? r.total;
  const chg = r.total - base;
  const chgPct = base ? (chg / base * 100) : 0;
  const t = new Date(r.ts*1000).toLocaleString();
  const stat = (k,v,c="")=>`<span class="stat"><span class="k">${k}</span><span class="v ${c}">${v}</span></span>`;
  el.innerHTML = [
    stat("Time", t),
    stat("Total", money(r.total), cls(chg)),
    stat("Cash", money(r.cash)),
    stat("Positions", money(r.positions_val)),
    stat("Realized", money(r.realized_pnl), cls(r.realized_pnl)),
    stat("Change", `${money(chg)} (${pct(chgPct)})`, cls(chg)),
  ].join("");
}

function renderEquity(rows){
  equityRows = rows;
  const labels = rows.map(r=>new Date(r.ts*1000).toLocaleTimeString());
  const data = rows.map(r=>r.total);
  if(!chart){
    chart = new Chart($("equityChart"), {
      type:"line",
      data:{labels, datasets:[{data, borderColor:"#7c5cff", backgroundColor:"rgba(124,92,255,.12)",
        fill:true, tension:.25, pointRadius:0, pointHoverRadius:5,
        pointHoverBackgroundColor:"#7c5cff", pointHoverBorderColor:"#e6edf3",
        pointHoverBorderWidth:2, borderWidth:2}]},
      options:equityChartOptions,
      plugins:[{
        id:"equityHoverBar",
        afterEvent(chart, {event}){
          if(event.type !== "mousemove" && event.type !== "mouseout") return;
          const pts = chart.getElementsAtEventForMode(event, "index", {intersect:false}, false);
          setEquityHover(pts[0]?.index ?? null);
        },
      }],
    });
  } else {
    chart.data.labels = labels;
    chart.data.datasets[0].data = data;
    chart.update("none");
  }
}

function aiCell(a){
  if(!a) return '<span class="muted" title="Priced by the built-in parser (AI off)">parser</span>';
  const sum = (a.summary || "").replace(/"/g, "&quot;");
  return `<span class="verdict trade" title="${sum}">AI ✓</span>`;
}

function renderOpps(rows){
  $("oppCount").textContent = rows.length ? `(${rows.length})` : "";
  if(!rows.length){ $("oppTable").innerHTML = `<tr><td class="empty">No opportunities right now. Try "Scan now" or lower min_edge.</td></tr>`; return; }
  $("oppTable").innerHTML = `<tr><th>Type</th><th>AI</th><th>Market</th><th>Side</th><th>Price</th><th>Fair</th><th>Edge</th><th>Conf</th></tr>` +
    rows.map(o=>`<tr>
      <td><span class="pill ${o.kind}">${o.kind}</span></td>
      <td>${aiCell(o.analysis)}</td>
      <td class="q" title="${o.question}">${o.question}</td>
      <td>${o.side}</td>
      <td>${o.price.toFixed(3)}</td>
      <td>${o.fair_value.toFixed(3)}</td>
      <td class="pos">+${o.edge.toFixed(3)}</td>
      <td>${o.confidence.toFixed(2)}</td></tr>`).join("");
}

function renderReport(r){
  const body = $("reportBody");
  $("reportSub").textContent = r.resolved ? `· ${r.resolved} resolved trades` : "";
  const banner = `<div class="report-banner ${r.stage}">
    <b>${r.stage.replace("_"," ").toUpperCase()}</b> — ${r.stage_msg}</div>`;
  if(!r.resolved){
    body.innerHTML = banner + `<div class="ai-off">No resolved trades yet. This report fills
      in as the markets the bot bet on actually settle. A trustworthy read needs ~100+ resolved
      trades (ideally 200+) — keep it running.</div>`;
    return;
  }
  const ci = r.win_rate_ci;
  const sig = r.significance
    ? (r.significance.distinguishable ? "yes" : "not yet") : "—";
  const cards = [
    {label:"Win rate", value:(r.win_rate*100).toFixed(0)+"%",
      sub:`95% CI ${(ci[0]*100).toFixed(0)}–${(ci[1]*100).toFixed(0)}%`},
    {label:"Realized P&L", value:money(r.realized_pnl), cls:cls(r.realized_pnl),
      sub:`on ${money(r.deployed)} deployed`},
    {label:"ROI", value:(r.roi*100>=0?"+":"")+(r.roi*100).toFixed(1)+"%", cls:cls(r.roi)},
    {label:"Avg / trade", value:money(r.avg_pnl), cls:cls(r.avg_pnl)},
    {label:"Edge vs luck", value:sig, sub:r.significance?`t=${r.significance.t.toFixed(2)}`:""},
    {label:"Wins / losses", value:`${r.wins} / ${r.losses}`},
  ];
  const grid = `<div class="report-grid">` + cards.map(c=>
    `<div class="card"><div class="label">${c.label}</div>
       <div class="value ${c.cls||''}">${c.value}</div>
       ${c.sub?`<div class="sub">${c.sub}</div>`:""}</div>`).join("") + `</div>`;

  // calibration table (only populated buckets)
  const cal = (r.calibration||[]).filter(b=>b.n>0);
  let calHtml = `<div class="ai-note">Calibration — of the bets the model rated in each band,
    how often they actually resolved YES. Close predicted ≈ actual = well-calibrated.
    (${r.settled_for_calibration} settled probabilistic bets)</div>`;
  if(cal.length){
    calHtml += `<div class="table-wrap"><table>
      <tr><th>Model said</th><th>Predicted</th><th>Actually won</th><th>n</th></tr>` +
      cal.map(b=>{
        const off = Math.abs(b.predicted-b.actual);
        const c = off<0.1?"pos":(off<0.2?"":"neg");
        return `<tr><td>${(b.lo*100).toFixed(0)}–${(b.hi*100).toFixed(0)}%</td>
          <td>${(b.predicted*100).toFixed(0)}%</td>
          <td class="${c}">${(b.actual*100).toFixed(0)}%</td>
          <td class="muted">${b.n}</td></tr>`;
      }).join("") + `</table></div>`;
  } else {
    calHtml += `<div class="empty">No settled probabilistic bets yet.</div>`;
  }

  // AI-vetted split
  let aiHtml = "";
  const split = r.ai_split||{};
  if(Object.keys(split).length){
    aiHtml = `<div class="ai-note" style="margin-top:14px">AI-vetted vs not (does the AI help?):</div>
      <div class="table-wrap"><table><tr><th>Group</th><th>Trades</th><th>Win</th><th>P&L</th></tr>` +
      Object.entries(split).map(([k,d])=>`<tr>
        <td>${k.replace("_"," ")}</td><td>${d.n}</td>
        <td>${d.n?(d.wins/d.n*100).toFixed(0):0}%</td>
        <td class="${cls(d.pnl)}">${money(d.pnl)}</td></tr>`).join("") + `</table></div>`;
  }
  body.innerHTML = banner + grid + calHtml + aiHtml;
}

function renderAI(d){
  $("aiModel").textContent = d && d.model ? `· ${d.model}` : "";
  const body = $("aiBody");
  if(!d || !d.enabled){
    body.innerHTML = `<div class="ai-off">AI market understanding is <b>off</b>.<br>
      It reads each market's question <i>and resolution rules</i> to price markets the
      parser misses and skip ones with tricky/ambiguous rules.<br><br>
      To turn it on: put your key in <code>.env</code>
      (<code>ANTHROPIC_API_KEY=sk-ant-…</code>) and set
      <code>strategy.enable_llm_understanding: true</code> in config.yaml.</div>`;
    return;
  }
  if(!d.active){
    body.innerHTML = `<div class="ai-off">AI is enabled but <b>inactive</b> — no API key found.
      Add <code>ANTHROPIC_API_KEY</code> to your <code>.env</code> and restart.</div>`;
    return;
  }
  const st = d.stats || {};
  const cards = [
    {label:"Markets reviewed", v:st.analyzed||0},
    {label:"Cleared to trade", v:st.tradeable||0, cls:"pos"},
    {label:"Skipped (risky)", v:st.gated||0, cls:"neg"},
    {label:"Crypto-priceable", v:st.crypto||0},
  ];
  const cardsHtml = `<div class="ai-cards">` + cards.map(c=>
    `<div class="card"><div class="label">${c.label}</div>
       <div class="value ${c.cls||''}">${c.v}</div></div>`).join("") + `</div>`;
  const note = `<div class="ai-note">The AI has reviewed <b>${st.analyzed||0}</b> markets and told the
    bot to <b>skip ${st.gated||0}</b> as too tricky or ambiguous to price safely — bad bets avoided.
    Whether it improves <i>profit</i> is judged once trades resolve (calibration), not from this count alone.</div>`;
  const recent = d.recent || [];
  let feed;
  if(!recent.length){
    feed = `<div class="empty">No markets analyzed yet — run a scan or a cycle.</div>`;
  } else {
    feed = `<div class="table-wrap tall"><table>
      <tr><th>Verdict</th><th>Risk</th><th>Market</th><th>What the AI sees</th></tr>` +
      recent.map(r=>{
        const skip = (!r.tradeable) || r.resolution_risk === "high";
        const verdict = skip ? `<span class="verdict skip">skip</span>`
                             : `<span class="verdict trade">trade</span>`;
        const risk = `<span class="risk-${r.resolution_risk||'medium'}">${r.resolution_risk||'?'}</span>`;
        const sum = r.summary || "";
        return `<tr>
          <td>${verdict}</td>
          <td>${risk}</td>
          <td class="q" title="${(r.question||'').replace(/"/g,'&quot;')}">${r.question||''}</td>
          <td class="q muted" title="${sum.replace(/"/g,'&quot;')}">${sum}</td></tr>`;
      }).join("") + `</table></div>`;
  }
  body.innerHTML = cardsHtml + note + feed;
}

function renderPositions(rows){
  if(!rows.length){ $("posCount").textContent=""; $("posTable").innerHTML = `<tr><td class="empty">No open positions yet.</td></tr>`; return; }
  const totalPnl = rows.reduce((a,p)=>a+p.pnl,0);
  $("posCount").innerHTML = `(${rows.length}) · unrealized <span class="${cls(totalPnl)}">${money(totalPnl)}</span>`;
  $("posTable").innerHTML = `<tr><th>Type</th><th>Market</th><th>Side</th><th class="num">#</th><th class="num">Entry</th><th class="num">Now</th><th class="num">Value</th><th class="num">P&L</th><th class="num">%</th><th class="num">Age</th></tr>` +
    rows.map(p=>{
      const now = p.cur_price==null ? '<span class="muted">—</span>' : p.cur_price.toFixed(3);
      return `<tr>
      <td><span class="pill ${p.kind}">${p.kind}</span></td>
      <td class="q" title="${p.market}">${p.market}</td>
      <td>${p.side_name}</td>
      <td class="num">${p.shares.toFixed(1)}</td>
      <td class="num">${p.avg_cost.toFixed(3)}</td>
      <td class="num">${now}</td>
      <td class="num">${money(p.cur_value)}</td>
      <td class="num ${cls(p.pnl)}">${money(p.pnl)}</td>
      <td class="num ${cls(p.pnl)}">${pct(p.pnl_pct)}</td>
      <td class="num muted">${p.age_min.toFixed(0)}m</td></tr>`;}).join("");
}

function renderTrades(rows){
  if(!rows.length){ $("tradeTable").innerHTML = `<tr><td class="empty">No trades yet.</td></tr>`; return; }
  $("tradeTable").innerHTML = `<tr><th>Time</th><th>Side</th><th>Shares</th><th>Price</th><th>USD</th><th>Note</th></tr>` +
    rows.map(t=>`<tr>
      <td class="muted">${new Date(t.ts*1000).toLocaleTimeString()}</td>
      <td><span class="pill ${t.side}">${t.side}</span></td>
      <td>${t.shares.toFixed(1)}</td>
      <td>${t.price.toFixed(3)}</td>
      <td>${money(t.usd)}</td>
      <td class="q muted" title="${t.note||''}">${t.note||''}</td></tr>`).join("");
}

function renderLogs(lines){
  const box = $("logs");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.innerHTML = lines.map(l=>{
    const lvl = (l.match(/\b(INFO|WARNING|ERROR|DEBUG)\b/)||[])[1] || "INFO";
    return `<div class="l-${lvl}">${l.replace(/</g,"&lt;")}</div>`;
  }).join("");
  if(atBottom) box.scrollTop = box.scrollHeight;
}

async function control(action){
  await api("/api/control", {method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action})});
  setTimeout(refresh, 300);
}
async function scan(){
  $("btnScan").disabled = true; $("btnScan").textContent = "Scanning…";
  try{ renderOpps(await api("/api/scan",{method:"POST"})); }
  finally{ $("btnScan").disabled=false; $("btnScan").textContent="🔍 Scan now"; }
}

// ---- settings ----
const FIELDS = [
  ["strategy","min_edge"],["strategy","arb_min_profit"],["strategy","imbalance_coeff"],
  ["strategy","momentum_coeff"],["strategy","min_confidence"],
  ["risk","max_fraction_per_trade"],["risk","kelly_fraction"],["risk","max_total_exposure"],
  ["risk","max_open_positions"],["risk","take_profit"],["risk","stop_loss"],
  ["universe","min_liquidity"],["universe","min_volume_24hr"],
];
async function loadSettings(){
  const cfg = await api("/api/config");
  $("settings").innerHTML = FIELDS.map(([sec,key])=>{
    const v = (cfg[sec]||{})[key];
    return `<label>${sec}.${key}
      <input data-sec="${sec}" data-key="${key}" value="${v??''}"/></label>`;
  }).join("");
}
async function saveSettings(){
  const out = {strategy:{},risk:{},universe:{}};
  document.querySelectorAll("#settings input").forEach(i=>{
    out[i.dataset.sec][i.dataset.key] = i.value;
  });
  await api("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(out)});
  $("saveMsg").textContent = "Saved ✓"; setTimeout(()=>$("saveMsg").textContent="",2000);
}

loadSettings();
refresh();
setInterval(refresh, 4000);
</script>
